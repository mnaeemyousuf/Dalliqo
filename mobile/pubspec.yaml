name: real_estate_crm
description: Offline-first real estate CRM for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  dio: ^5.4.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.1
  socket_io_client: ^3.1.6
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  google_maps_flutter: ^2.6.1
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  flutter_image_compress: ^2.3.0
  local_auth: ^3.0.2
  crypto: ^3.0.3
  uuid: ^4.4.0
  # Pinned by flutter_localizations to the version the installed Flutter SDK ships.
  intl: any
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/
  # Dalliqo typeface (Plus Jakarta Sans, OFL) — generated into assets/fonts by tools/brand.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
