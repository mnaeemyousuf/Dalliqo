name: Build Android APK

on:
  push:
    branches: [build-apk]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL baked into the app'
        default: 'https://dalliqo.naiqlabs.com'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://dalliqo.naiqlabs.com' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Errors are also written as annotations, which show on the run page without signing in.
      - name: Analyze
        run: |
          status=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          grep -E '^ *error ' analyze.txt | head -10 | while IFS= read -r l; do echo "::error title=analyze::$l"; done
          exit $status

      - name: Unit tests
        run: |
          status=0
          flutter test --reporter expanded > test.txt 2>&1 || status=$?
          cat test.txt
          grep -E '\[E\]|Error:|Expected:|Actual:' test.txt | head -10 | while IFS= read -r l; do echo "::error title=test::$l"; done
          exit $status

      - name: Build release APK
        run: |
          status=0
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL > build.txt 2>&1 || status=$?
          cat build.txt
          if [ $status -ne 0 ]; then
            grep -E 'Error:|error:|What went wrong|FAILURE|Could not|requires|incompatible' -A2 build.txt | grep -v '^--' | head -10 | while IFS= read -r l; do echo "::error title=build::$l"; done
          fi
          exit $status

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Stateown-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: stateown-apk
          path: dist/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Stateown APK (build ${{ github.run_number }})
          prerelease: true
          body: |
            Android APK built from `${{ github.sha }}`.
            API: ${{ env.API_BASE_URL }}
            Signed with a debug key (sideload only, not for Play Store).
          files: dist/*.apk
