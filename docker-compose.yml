# Local stack: MongoDB (single-node replica set) + API + web CRM.
# Flutter runs on a device/emulator and talks to the API on port 4000.
#
#   cp .env.example .env   # set JWT_SECRET / JWT_REFRESH_SECRET
#   docker compose up --build
#   open http://localhost:8080
#   docker compose exec api node dist/scripts/seed.js   # optional demo data

services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/recrm?replicaSet=rs0
      PORT: "4000"
      TRUST_PROXY: "1"
      CORS_ORIGINS: http://localhost:8080
      APP_WEB_URL: http://localhost:8080
      PUBLIC_API_URL: http://localhost:8080
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
  uploads:
